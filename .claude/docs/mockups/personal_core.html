  <script>
    let cardCount = 4;
    const MAX_CARDS = 8;
    
    function toggleAddDropdown() {
        const dropdown = document.getElementById('add-card-dropdown');
        if (dropdown.classList.contains('opacity-0')) {
            dropdown.classList.remove('opacity-0', 'invisible', 'scale-95');
            dropdown.classList.add('opacity-100', 'visible', 'scale-100');
        } else {
            dropdown.classList.add('opacity-0', 'invisible', 'scale-95');
            dropdown.classList.remove('opacity-100', 'visible', 'scale-100');
        }
    }
    
    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        const wrapper = document.getElementById('add-card-wrapper');
        const dropdown = document.getElementById('add-card-dropdown');
        if (wrapper && !wrapper.contains(e.target)) {
            dropdown.classList.add('opacity-0', 'invisible', 'scale-95');
            dropdown.classList.remove('opacity-100', 'visible', 'scale-100');
        }
    });
    
    function addCard(category, question) {
        if (cardCount >= MAX_CARDS) return;
        
        toggleAddDropdown();
        
        const grid = document.getElementById('cards-grid');
        const template = `
            <div class="bg-white dark:bg-[#1c1c1c] p-6 rounded-2xl border border-gray-200 dark:border-[#f4f4f6]/20 shadow-sm flex flex-col relative group hover:border-[#d2691e]/30 transition-colors animate-[fadeIn_0.3s_ease-out]">
                <div class="text-field-wrapper flex-1 flex flex-col relative">
                <div class="flex justify-between items-start mb-3 gap-3">
                    <label class="field-label block text-sm font-bold text-gray-900 dark:text-[#f4f4f6] transition-colors leading-snug flex-1">
                            ${question ? question : '<input type="text" class="w-full bg-transparent border-b border-[#d2691e] outline-none placeholder-gray-400 focus:border-b-2 font-normal text-sm" placeholder="Type your custom question here..." autofocus>'}
                        </label>
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity flex items-center shrink-0">
                        <!-- INLINE DELETE -->
                    <div class="relative flex items-center inline-delete-container" onmouseleave="resetDelete(this)">
                        <button type="button" onclick="showInlineConfirm(this, event)" class="p-1.5 text-gray-400 hover:text-red-500 transition-colors rounded-md hover:bg-white dark:hover:bg-[#1c1c1c] shadow-sm delete-trigger bg-transparent border border-transparent" title="Delete">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                        <div class="hidden inline-confirm items-center gap-1 bg-red-50 dark:bg-red-500/10 rounded-md px-1 py-0.5 z-50 whitespace-nowrap shadow-md border border-red-200 dark:border-red-500/30">
                            <button type="button" onclick="executeDelete(this, event)" class="p-0.5 text-red-500 hover:bg-red-50 dark:hover:bg-red-500/20 rounded transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <button type="button" onclick="cancelDelete(this, event)" class="p-0.5 text-gray-500 hover:bg-gray-100 dark:hover:bg-[#121214] rounded transition-colors">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    </div>
                    </div>
                </div>
                    
                    <div class="relative flex-1 flex flex-col">
                        <textarea rows="4" class="editable-text-input py-3 px-4 block w-full bg-gray-50 dark:bg-[#121214] border border-gray-200 dark:border-[#f4f4f6]/20 rounded-xl text-sm text-gray-900 dark:text-[#f4f4f6] transition-all duration-300 resize-none pb-8 flex-1" placeholder="Write your answer or personal take here (keep it punchy)..." maxlength="300" oninput="updateCounter(this)"></textarea>
                        
                        <div class="absolute bottom-2 right-3 flex items-center">
                            <span class="text-[10px] text-gray-400 font-medium char-counter">0/300</span>
                        </div>
                        
                        
                    </div>
                </div>
            </div>
        `;
        
        grid.insertAdjacentHTML('beforeend', template);
        cardCount++;
        checkCardLimit();
    }
    
    function checkCardLimit() {
        const btn = document.getElementById('add-card-btn');
        if (cardCount >= MAX_CARDS) {
            btn.classList.add('opacity-50', 'pointer-events-none');
            btn.title = "Limit of 8 cards reached. Edit or remove a card to add new context.";
        } else {
            btn.classList.remove('opacity-50', 'pointer-events-none');
            btn.title = "";
        }
    }
    
    function updateCounter(textarea) {
        const counter = textarea.nextElementSibling.querySelector('.char-counter');
        counter.textContent = `${textarea.value.length}/300`;
    }
    
  </script>

  <!-- Toast -->
  <div id="arkion-toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] flex flex-col overflow-hidden bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-[-100%] opacity-0 pointer-events-none">
    <div class="flex items-center gap-3 px-4 py-3">
      <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <span class="text-sm font-medium">Changes saved successfully!</span>
    </div>
    <!-- Progress Bar -->
    <div class="w-full h-1 bg-gray-800 dark:bg-gray-200">
      <div id="toast-progress" class="h-full bg-[#d2691e]" style="width: 100%;"></div>
    </div>
  </div>

  <script>
    let toastTimeout;
    function showToast() {
      const toast = document.getElementById('arkion-toast');
      const progress = document.getElementById('toast-progress');
      
      progress.style.transition = 'none';
      progress.style.width = '100%';
      void toast.offsetWidth;
      
      toast.classList.remove('translate-y-[-100%]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      progress.style.transition = 'width 3s linear';
      progress.style.width = '0%';
      
      if(toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-100%]', 'opacity-0');
      }, 3000);
    }
    
    // Inline Delete Logic
    function showInlineConfirm(btn, e) {
      if (e) e.stopPropagation();
      const container = btn.closest('.inline-delete-container');
      btn.classList.add('hidden');
      container.querySelector('.inline-confirm').classList.remove('hidden');
      container.querySelector('.inline-confirm').classList.add('flex');
    }

    function cancelDelete(btn, e) {
      if (e) e.stopPropagation();
      const container = btn.closest('.inline-delete-container');
      container.querySelector('.inline-confirm').classList.add('hidden');
      container.querySelector('.inline-confirm').classList.remove('flex');
      container.querySelector('.delete-trigger').classList.remove('hidden');
    }

    function resetDelete(container) {
      const confirmBox = container.querySelector('.inline-confirm');
      if(confirmBox && !confirmBox.classList.contains('hidden')) {
        cancelDelete(confirmBox.querySelector('button'), null);
      }
    }

    function executeDelete(btn, e) {
      if (e) e.stopPropagation();
      // Remove the card
      const card = btn.closest('.group');
      if(card) {
          card.remove();
          cardCount--;
          checkCardLimit();
      }
    }
  </script>
</body>
</html>
